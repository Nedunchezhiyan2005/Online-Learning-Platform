{% extends "base.html" %}

{% block title %}Page Not Found (404) | Centralized Online Learning Platform{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h3 class="fw-bold text-dark mb-3">Resource Not Found</h3>
        <p class="text-muted mb-4 lead">The course, lesson, or resource you are looking for does not exist or has been moved.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="{{ url_for('courses.list_courses') }}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-search me-1"></i> Browse Catalog
            </a>
        </div>
    </div>
</div>
{% endblock %}
